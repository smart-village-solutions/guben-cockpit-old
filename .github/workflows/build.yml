name: perform a build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install shared dependencies
        run: npm ci --prefix shared

      - name: Test shared contracts
        run: npm run test:coverage --prefix shared

      - name: Install content-gateway dependencies
        run: npm ci --prefix content-gateway

      - name: Lint content-gateway
        run: npm run lint --prefix content-gateway

      - name: Typecheck content-gateway
        run: npm run typecheck --prefix content-gateway

      - name: Test content-gateway
        run: npm test --prefix content-gateway

      - name: Build content-gateway
        run: npm run build --prefix content-gateway

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test frontend startup scripts
        run: node frontend/docker/start-frontend.test.mjs

      - name: Test frontend prerender scripts
        run: node frontend/scripts/prerender-public-routes.test.mjs

      - name: Start mock content-gateway
        run: |
          PORT=5100 \
          LOG_LEVEL=silent \
          PUBLIC_BASE_URL=http://127.0.0.1:3000 \
          MASTERPORTAL_URL=http://masterportal \
          CONTENT_SOURCE_MODE=mock \
          DEFAULT_LANGUAGE=de \
          FALLBACK_LANGUAGE=de \
          npm start --prefix content-gateway &
          # Wait up to ~60 seconds for the gateway to become ready (30 attempts * 2 seconds)
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5100/health && curl --fail http://127.0.0.1:5100/health/live && curl --fail http://127.0.0.1:5100/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify frontend against gateway contracts
        run: |
          VITE_CONTENT_GATEWAY_URL=http://127.0.0.1:5100 \
          VITE_PUBLIC_CONTENT_SOURCE=gateway \
          npm run verify:gateway-contracts --prefix frontend

      - name: Build Vite app with prerender
        run: |
          VITE_CONTENT_GATEWAY_URL=http://127.0.0.1:5100 \
          VITE_PUBLIC_CONTENT_SOURCE=gateway \
          npm run build --prefix frontend

      - name: Test frontend build output exists
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/projects/index.html
          test -f frontend/dist/events/index.html
          test -f frontend/dist/map/index.html
          echo "Build successful"

      - name: Install postgrest test dependencies
        run: npm ci --prefix postgrest

      - name: Run postgrest smoke tests
        run: npm test --prefix postgrest
